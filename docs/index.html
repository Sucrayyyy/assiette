<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Assiette</title>
  <meta name="description" content="Compte tes calories avec un scan IA de tes plats.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Assiette">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F6F8F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D100F" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app"></div>
  <div id="scan"></div>
  <div id="session" class="sport"></div>
  <div id="sheet"></div>
  <div id="wsheet" class="sport"></div>
  <div id="barcode"></div>
  <input type="file" id="photo-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="photo-library" accept="image/*" hidden>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
