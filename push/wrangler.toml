name = "assiette-rappels"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Sites autorisés à s'abonner aux rappels (séparés par des virgules).
ALLOWED_ORIGINS = "https://sucrayyyy.github.io"
VAPID_SUBJECT = "https://sucrayyyy.github.io/assiette/"
VAPID_PUBLIC = "BFdOPPtBhPojrj0efu6agHhzxQ3GOTUyz8ETFBJNjW4oXO1jCssz0EWsf3qqcrtMKY26HMcZ8ACeLdDi2FBBHIs"

# Toutes les heures : chaque téléphone reçoit ses rappels à 16 h, 18 h et 20 h de son fuseau horaire.
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "RAPPELS"
# Rempli par « npm run setup ».
id = "e809e906fab84f63848c965d1725bb68"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
